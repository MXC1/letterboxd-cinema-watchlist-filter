<!DOCTYPE html>
<html>
<head>
  <title>Letterboxd Cinema Watchlist Filter</title>
  <style>
    html, body {
      width: 350px;
      min-height: 350px;
      background: #181818;
      color: #f3f3f3;
      font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      padding: 20px 18px 18px 18px;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      font-size: 1.3em;
      color: #ffb400;
      letter-spacing: 0.5px;
    }
    label {
      font-weight: 500;
      margin-bottom: 4px;
      display: block;
    }
    input[type="text"] {
      width: 100%;
      margin-bottom: 10px;
      padding: 7px 10px;
      border-radius: 5px;
      border: 1px solid #444;
      background: #222;
      color: #f3f3f3;
      font-size: 1em;
      box-sizing: border-box;
    }
    button {
      margin-top: 8px;
      padding: 8px 18px;
      background: #ffb400;
      color: #181818;
      border: none;
      border-radius: 5px;
      font-weight: 600;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #ffd966;
    }
    textarea {
      width: 100%;
      height: 140px;
      margin-top: 10px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #444;
      background: #222;
      color: #f3f3f3;
      font-size: 1em;
      box-sizing: border-box;
      resize: vertical;
    }
    #status {
      margin-top: 10px;
      font-size: 1em;
      color: #ffb400;
      min-height: 22px;
    }
    #last-fetched {
      margin-top: 4px;
      font-size: 0.95em;
      color: #aaa;
      min-height: 18px;
    }
    hr {
      border: none;
      border-top: 1px solid #333;
      margin: 18px 0;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .toggle-row span {
      font-weight: 500;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #444;
      transition: 0.2s;
      border-radius: 22px;
    }
    .slider::before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: #f3f3f3;
      transition: 0.2s;
      border-radius: 50%;
    }
    .switch input:checked + .slider {
      background-color: #ffb400;
    }
    .switch input:checked + .slider::before {
      transform: translateX(18px);
    }
    button.secondary {
      background: #333;
      color: #f3f3f3;
      margin-right: 8px;
    }
    button.secondary:hover {
      background: #444;
    }
    #calendar-status {
      margin-top: 10px;
      font-size: 0.9em;
      color: #aaa;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h2>Letterboxd Cinema Watchlist Filter</h2>
  <label for="username">Letterboxd Username:</label>
  <input type="text" id="username" placeholder="e.g. mxc48" />
  <button id="fetch">Fetch Watchlist</button>
  <p style="margin-top:18px;">Or paste your watchlist film titles (one per line):</p>
  <textarea id="watchlist"></textarea>
  <div id="status"></div>
  <div id="last-fetched"></div>

  <hr>
  <h2 style="font-size:1.1em;">Google Calendar Sync</h2>
  <p style="margin-top:0; color:#aaa; font-size:0.9em;">
    Auto-adds Prince Charles Cinema showings that are on your watchlist, or that fall
    on a weekday between 5-7pm, to a dedicated "Prince Charles Cinema" Google Calendar.
  </p>
  <div class="toggle-row">
    <span>Enable auto-sync</span>
    <label class="switch">
      <input type="checkbox" id="sync-enabled">
      <span class="slider"></span>
    </label>
  </div>
  <button id="connect-google" class="secondary">Connect Google Account</button>
  <button id="sync-now">Sync Now</button>
  <div id="calendar-status"></div>

  <script src="popup.js"></script>
</body>
</html>
